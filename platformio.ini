; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
src_dir = main

[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = espidf

#board_microros_transport = serial
# For WiFi transport, uncomment the line below and comment the line above
board_microros_transport = wifi
board_microros_user_meta = custom.meta
board_microros_distro = jazzy
monitor_speed = 115200
; micro-ROS is provided as an ESP-IDF component in components/micro_ros_espidf_component
; (NOT via lib_deps: the ESP-IDF build only discovers components under components/)