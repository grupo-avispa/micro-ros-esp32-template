; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
src_dir = main

[env:esp32-s3-devkitc-1]
platform = espressif32@6.13.0
board = esp32-s3-devkitc-1
framework = espidf

#board_microros_transport = serial
# For WiFi transport, uncomment the line below and comment the line above
board_microros_transport = wifi
board_microros_user_meta = custom.meta
board_microros_distro = jazzy
monitor_speed = 115200
extra_scripts = pre:scripts/sanitize_env.py

; Debug through the built-in USB-Serial/JTAG of the ESP32-S3 (port labelled "USB", VID:PID 303a:1001)
build_type = debug
debug_tool = esp-builtin
debug_speed = 5000
; OpenOCD 0.11 (default) drops the built-in USB-JTAG on `reset halt`; 0.12 fixes it.
; debug_port forces TCP: PlatformIO Core 6.2 pipe mode uses `gdb port pipe`, removed in 0.12
debug_port = :3333
; GDB does not flash the firmware (OpenOCD `load` fails to erase this board's flash):
; run `./build.sh run -t upload` before debugging
debug_load_mode = manual
platform_packages =
    platformio/tool-openocd-esp32@2.1200.20230419
; Optional: also flash through the same port instead of the UART one
upload_protocol = esp-builtin
; micro-ROS is provided as an ESP-IDF component in components/micro_ros_espidf_component
; (NOT via lib_deps: the ESP-IDF build only discovers components under components/)